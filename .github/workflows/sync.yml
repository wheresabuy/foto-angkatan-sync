name: Auto Sync Pas Foto 3x4

on:
  schedule:
    # Berjalan otomatis setiap 5 menit (batas tercepat yang diizinkan GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Tombol "Run workflow" manual dari GitHub Web / HP
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pillow reportlab python-docx

      - name: Run Sync & Auto-Upload to Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python sync_and_generate.py --upload-drive

      - name: Commit and Push Updated Documents & State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/students_state.json data/processed_3x4/ Foto_3x4_Teman_Angkatan_Siap_Gunting.pdf Foto_3x4_Teman_Angkatan_Lengkap.pdf Foto_3x4_Teman_Angkatan_Siap_Gunting.docx Foto_3x4_Teman_Angkatan_Lengkap.docx
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Auto-sync pas foto 3x4 (Cloud Update) [skip ci]"
            git push
          fi
